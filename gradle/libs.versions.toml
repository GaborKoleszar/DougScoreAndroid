android-test = { id = "com.android.test", version.ref = "androidTestPlugin"}
baseline-profile = { id = "androidx.baselineprofile", version.ref = "baselineProfilePlugin"}
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hiltAndroid" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinAndroidPlugin" }
