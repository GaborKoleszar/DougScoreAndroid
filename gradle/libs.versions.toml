poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poiOoxml" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

[plugins]
android-gradle-plugin = { id = "com.android.application", version.ref = "androidGradlePlugin"}
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinAndroidPlugin" }
gms-services = { id = "com.google.gms.google-services", version.ref = "gmsServicesPlugin"}
